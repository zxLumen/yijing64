name: docker

# 构建 yijing64 网页版运行镜像 → ghcr.io/zxlumen/yijing64-web
# 服务器只 pull、不构建(与 zxLumen-Blog 的 app / opentodo 镜像同样的模式)。
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/zxlumen/yijing64-web:latest
            ghcr.io/zxlumen/yijing64-web:${{ github.sha }}
